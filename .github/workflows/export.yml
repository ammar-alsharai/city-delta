name: Daily data export

on:
  schedule:
    - cron: "40 6 * * *"     # 06:40 UTC = 07:40 Amsterdam in winter, after the 06:00 Databricks Job
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # allows the job to commit the new JSON files
  pages: write                # allows the job to ask GitHub Pages to rebuild

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Export gold tables to JSON
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: python export/export_gold.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily data export $(date -u +%F)"
            git push
          fi

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
